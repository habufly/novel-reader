appId: com.habufly.novelreader
productName: Novel Reader
copyright: Copyright © 2026 habufly

directories:
  buildResources: build
  output: dist

# electron-builder 預設是「全部收進去，再依下列規則排除」
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!build/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!tsconfig.json'
  - '!electron-builder.yml'
  - '!{PLAN.md,README.md,CHANGELOG.md,.editorconfig,.gitignore}'
  - '!{.env,.env.*,.npmrc,package-lock.json,pnpm-lock.yaml,yarn.lock}'

asarUnpack:
  - resources/**

# 系統匣圖示要在執行期讀得到，build/ 本身不會被打包進去
extraResources:
  - from: build/icon.ico
    to: icon.ico

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Novel Reader
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-Portable.${ext}

# 發佈管道。這段同時會把 app-update.yml 打包進去，
# 自動更新才知道要去哪裡找新版本。本機建置不會上傳，
# 只有 CI 上帶著標籤建置（或加 --publish always）才會真的發佈。
publish:
  provider: github
  owner: habufly
  repo: novel-reader
  # 預設是 draft，而草稿對 electron-updater 是不可見的 ——
  # 自動更新會一直回報「還沒有發佈任何版本」。直接發正式版。
  releaseType: release
