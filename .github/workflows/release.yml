name: Release

# 推送 v 開頭的標籤就建置並發佈到 GitHub Releases。
# 例：git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 型別檢查
        run: npm run typecheck

      - name: 編譯
        run: npm run build

      # 先把 Release 建好再交給 electron-builder 上傳。
      # 它會同時上傳四個產物（Setup、Portable、blockmap、latest.yml），
      # 每個上傳器各自檢查「這個標籤有沒有 Release」，若都在對方建立前
      # 檢查到「沒有」就會各建一個，結果是兩個 Release 把檔案分走 ——
      # v1.0.0 就是這樣只剩一個 blockmap 在公開的那一個裡面。
      - name: 先建立 Release
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，直接沿用"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包並上傳
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
