name: Release

# 推送 v 開頭的標籤就建置並發佈到 GitHub Releases。
# 例：git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 型別檢查
        run: npm run typecheck

      - name: 編譯
        run: npm run build

      - name: 打包並發佈
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
